[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "fade-model-router"
version = "0.1.0"
requires-python = ">=3.12"
dependencies = [
    "fade-domain",
    "httpx>=0.28.0",
    "pydantic>=2.10.0",
]

[tool.hatch.build.targets.wheel]
packages = ["src/fade_model_router"]

[tool.uv.sources]
fade-domain = { workspace = true }
