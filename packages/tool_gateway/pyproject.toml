[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "fade-tool-gateway"
version = "0.1.0"
requires-python = ">=3.12"
dependencies = [
    "fade-domain",
    "fade-guardian",
]

[tool.hatch.build.targets.wheel]
packages = ["src/fade_tool_gateway"]

[tool.uv.sources]
fade-domain = { workspace = true }
fade-guardian = { workspace = true }
