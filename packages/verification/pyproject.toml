[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "fade-verification"
version = "0.1.0"
requires-python = ">=3.12"
dependencies = [
    "fade-domain",
    "fade-tool-gateway",
]

[tool.hatch.build.targets.wheel]
packages = ["src/fade_verification"]

[tool.uv.sources]
fade-domain = { workspace = true }
fade-tool-gateway = { workspace = true }
