[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "fade-planning"
version = "0.1.0"
requires-python = ">=3.12"
dependencies = [
    "fade-domain",
    "fade-model-router",
    "pydantic>=2.10.0",
]

[tool.hatch.build.targets.wheel]
packages = ["src/fade_planning"]

[tool.uv.sources]
fade-domain = { workspace = true }
fade-model-router = { workspace = true }
