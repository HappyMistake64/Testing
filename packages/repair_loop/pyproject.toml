[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "fade-repair-loop"
version = "0.1.0"
requires-python = ">=3.12"
dependencies = [
    "fade-domain",
    "fade-verification",
    "pydantic>=2.10.0",
]

[tool.hatch.build.targets.wheel]
packages = ["src/fade_repair_loop"]

[tool.uv.sources]
fade-domain = { workspace = true }
fade-verification = { workspace = true }
