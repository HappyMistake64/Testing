[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "fade-infrastructure"
version = "0.1.0"
requires-python = ">=3.12"
dependencies = [
    "fade-application",
    "fade-domain",
    "sqlalchemy[asyncio]>=2.0.36",
    "aiosqlite>=0.20.0",
    "pydantic-settings>=2.6.0",
    "structlog>=24.4.0",
]

[tool.hatch.build.targets.wheel]
packages = ["src/fade_infrastructure"]

[tool.uv.sources]
fade-domain = { workspace = true }
fade-application = { workspace = true }
